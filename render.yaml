# Render blueprint.
#
# The trained model and the precomputed kiln analytics are committed to the
# repository, so the build only installs runtime dependencies. Nothing is
# generated or trained on the server.
#
# No `region` is declared on purpose: pinning one can conflict with the region
# a free account is already using, which fails the blueprint sync. Render picks
# a valid default.

services:
  - type: web
    name: ai-predictive-maintenance
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --threads 4 --timeout 120
    envVars:
      - key: APP_ENV
        value: production

      # Render needs a COMPLETE version here. A major.minor value such as
      # "3.12" is not resolved and the build fails. This env var takes
      # precedence over the .python-version file, which stays at "3.12"
      # because other hosts require that shorter form.
      - key: PYTHON_VERSION
        value: 3.12.7

      - key: FLASK_DEBUG
        value: 0
      - key: EMAIL_ENABLED
        value: 0
      - key: SMS_ENABLED
        value: 0

      # Render generates a strong random value once and keeps it stable.
      - key: FLASK_SECRET_KEY
        generateValue: true

      # You MUST supply these. Render prompts for them while applying the
      # blueprint. If they are left empty the application deliberately refuses
      # to start, because it would otherwise be public on the documented demo
      # passwords - and the deploy fails with
      # "Refusing to start in production with insecure configuration".
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMPLOYEE_PASSWORD
        sync: false
