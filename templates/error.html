{% extends 'base.html' %}
{% block title %}{{ code }} {{ title }}{% endblock %}

{% block content %}
<div class="panel" style="max-width: 620px; margin: 40px auto; text-align: center;">
    <p class="tag" style="margin-inline: auto;">
        <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
        Fault {{ code }}
    </p>
    <h1 style="font-size: 3.4rem; line-height: 1;">{{ code }}</h1>
    <h2 style="margin: 8px 0 10px;">{{ title }}</h2>
    <p class="text-muted">{{ message }}</p>
    <div class="row-gap" style="justify-content: center; margin-top: 18px;">
        <a class="btn btn-primary" href="{{ url_for('main.dashboard') }}">
            <i class="fa-solid fa-gauge-high" aria-hidden="true"></i> Back to dashboard
        </a>
        <a class="btn btn-ghost" href="{{ url_for('auth.login') }}">
            <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i> Sign in
        </a>
    </div>
</div>
{% endblock %}
